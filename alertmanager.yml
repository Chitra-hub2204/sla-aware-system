global:
  resolve_timeout: 1m
  # SMTP settings for Gmail (replace the password placeholder locally)
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'ugcet22055@gmail.com'
  smtp_auth_username: 'ugcet22055@gmail.com'
  smtp_auth_password: 'YOUR_APP_PASSWORD_PLACEHOLDER'
